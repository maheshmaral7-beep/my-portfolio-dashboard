<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --surface:#10151F; --surface-2:#171E2C; --border:#232B3A;
    --text:#E8ECF1; --text-dim:#8A93A6; --text-faint:#5B6272;
    --teal:#2DD4A7; --teal-dim:#123B31;
    --amber:#E8A33D; --amber-dim:#3D2E12;
    --red:#E15266; --red-dim:#3B141B;
    --blue:#4C8DFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .dim{color:var(--text-dim);}
  .faint{color:var(--text-faint);}

  header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);}
  .ticker{display:flex;gap:28px;padding:10px 20px;overflow-x:auto;align-items:center;}
  .ticker-item{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .ticker-item .name{color:var(--text-dim);font-size:12px;}
  .ticker-item .price{font-size:15px;font-weight:500;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot.fresh{background:var(--teal);}
  .dot.aging{background:var(--amber);}
  .dot.stale{background:var(--red);}

  nav.tabs{display:flex;gap:4px;padding:0 20px;background:var(--surface);}
  nav.tabs button{background:none;border:none;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:500;padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--text);border-bottom:2px solid var(--teal);}

  main{max-width:1100px;margin:0 auto;padding:24px 20px 80px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .card h3{font-size:14px;margin-bottom:12px;color:var(--text);}
  .card .updated{font-size:11px;color:var(--text-faint);margin-top:10px;}

  .metric-label{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .metric-value{font-size:22px;font-weight:500;font-family:'JetBrains Mono',monospace;}
  .metric-value.pos{color:var(--teal);}
  .metric-value.neg{color:var(--red);}

  .empty{border:1px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--text-dim);}
  .empty .action{display:inline-block;margin-top:10px;font-size:12px;color:var(--amber);background:var(--amber-dim);padding:5px 12px;border-radius:6px;}

  .news-item{padding:10px 0;border-bottom:1px solid var(--border);}
  .news-item:last-child{border-bottom:none;}
  .news-item a{color:var(--text);text-decoration:none;font-size:13.5px;}
  .news-item a:hover{color:var(--blue);}
  .news-source{font-size:11px;color:var(--text-faint);margin-top:3px;}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin:28px 0 12px;}
  .section-title:first-child{margin-top:0;}
</style>
</head>
<body>

<header class="top">
  <div class="ticker" id="ticker"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="equity">Equity</button>
    <button data-tab="news">News</button>
    <button data-tab="funds">Mutual Funds</button>
  </nav>
</header>

<main>

  <section id="tab-overview" class="tabpanel active">
    <div class="section-title">Opportunity radar <span class="faint mono" style="font-size:11px;">(rules-based screener, not advice &mdash; see "why" on each card)</span></div>
    <div class="grid grid-2" id="opportunity-radar"></div>

    <div class="section-title">Market snapshot</div>
    <div class="grid grid-4" id="overview-prices"></div>
  </section>

  <section id="tab-equity" class="tabpanel">
    <div class="section-title">Portfolio snapshot</div>
    <div class="grid grid-4" id="portfolio-snapshot"></div>

    <div class="section-title">Top picks today <span class="faint mono" style="font-size:11px;">(rules-based, not advice)</span></div>
    <div>
      <select id="sector-filter" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:12px;">
        <option value="all">All sectors</option>
      </select>
    </div>
    <div class="grid grid-2" id="top-picks"></div>
  </section>

  <section id="tab-news" class="tabpanel">
    <div class="section-title">Latest headlines <span class="faint mono" style="font-size:11px;">(raw feed &mdash; impact/beneficiary scoring not yet added)</span></div>
    <div class="grid grid-2" id="news-list"></div>
  </section>

  <section id="tab-funds" class="tabpanel">
    <div class="section-title">Fund performance</div>
    <div class="grid grid-4" id="fund-performance"></div>

    <div class="section-title">Allocation</div>
    <div class="grid grid-4" id="fund-allocation"></div>
  </section>

</main>

<script>
  const CONFIG = {
    DATA_URL: "https://raw.githubusercontent.com/maheshmaral7-beep/my-portfolio-dashboard/main/latest_data.json",
    OPPORTUNITIES_URL: "https://raw.githubusercontent.com/maheshmaral7-beep/my-portfolio-dashboard/main/opportunities.json",
    PORTFOLIO_URL: "https://raw.githubusercontent.com/maheshmaral7-beep/my-portfolio-dashboard/main/portfolio.json",
    MUTUAL_FUNDS_URL: "https://raw.githubusercontent.com/maheshmaral7-beep/my-portfolio-dashboard/main/mutual_funds.json",
    REFRESH_MS: 5 * 60 * 1000
  };

  const params = new URLSearchParams(window.location.search);
  const dataUrl = params.get("data") || CONFIG.DATA_URL;
  const oppUrl = params.get("opportunities") || CONFIG.OPPORTUNITIES_URL;
  const portfolioUrl = params.get("portfolio") || CONFIG.PORTFOLIO_URL;
  const mfUrl = params.get("mf") || CONFIG.MUTUAL_FUNDS_URL;
  let lastOpportunities = null;

  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tabpanel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  function freshnessClass(isoString){
    if(!isoString) return "stale";
    const diffMin = (Date.now() - new Date(isoString).getTime()) / 60000;
    if(diffMin < 10) return "fresh";
    if(diffMin < 60) return "aging";
    return "stale";
  }

  function timeAgo(isoString){
    if(!isoString) return "never";
    const diffMin = Math.round((Date.now() - new Date(isoString).getTime()) / 60000);
    if(diffMin < 1) return "just now";
    if(diffMin < 60) return diffMin + "m ago";
    return Math.round(diffMin/60) + "h ago";
  }

  function renderTicker(prices, fetchedAt){
    const el = document.getElementById("ticker");
    el.innerHTML = "";
    Object.entries(prices || {}).forEach(([name, data]) => {
      const item = document.createElement("div");
      item.className = "ticker-item";
      const price = (data && data.price != null) ? data.price.toLocaleString() : "--";
      item.innerHTML = `<span class="dot ${freshnessClass(fetchedAt)}"></span>
        <span class="name">${name}</span>
        <span class="price mono">${price}</span>`;
      el.appendChild(item);
    });
    if(!Object.keys(prices || {}).length){
      el.innerHTML = `<span class="dim">No price data yet &mdash; connect the feed (see poll.py / README)</span>`;
    }
  }

  function renderOverviewPrices(prices, fetchedAt){
    const el = document.getElementById("overview-prices");
    el.innerHTML = "";
    Object.entries(prices || {}).forEach(([name, data]) => {
      const card = document.createElement("div");
      card.className = "card";
      if(data && data.price != null){
        card.innerHTML = `<div class="metric-label">${name}</div>
          <div class="metric-value">${data.price.toLocaleString()}</div>
          <div class="updated">Updated ${timeAgo(fetchedAt)}</div>`;
      } else {
        card.innerHTML = `<div class="metric-label">${name}</div>
          <div class="dim" style="font-size:13px;">Unavailable</div>`;
      }
      el.appendChild(card);
    });
  }

  function renderPortfolio(portfolio){
    const el = document.getElementById("portfolio-snapshot");
    el.innerHTML = "";
    if(!portfolio || portfolio.status === "not_connected"){
      const div = document.createElement("div");
      div.style.gridColumn = "1 / -1";
      div.className = "empty";
      div.innerHTML = `Zerodha not linked yet.
        <div class="action">Connect Kite Connect Personal, or import a statement, to see real holdings here</div>`;
      el.appendChild(div);
      return;
    }
    const cards = [
      {label: "Portfolio Value", val: portfolio.portfolio_value},
      {label: "Invested Value", val: portfolio.invested_value},
      {label: "Total P&L", val: portfolio.total_pl, pct: portfolio.total_pl_pct},
      {label: "Top Contributor", val: portfolio.top_contributor ? `${portfolio.top_contributor.name} (+${portfolio.top_contributor.pl})` : "--"},
      {label: "Top Detractor", val: portfolio.top_detractor ? `${portfolio.top_detractor.name} (${portfolio.top_detractor.pl})` : "--"},
    ];
    cards.forEach(c => {
      const card = document.createElement("div");
      card.className = "card";
      let valStr = c.val;
      if(typeof c.val === "number") valStr = c.val.toLocaleString(undefined, {maximumFractionDigits:2});
      const cls = (typeof c.val === "number" && c.val < 0) ? "neg" : (typeof c.val === "number" ? "pos" : "");
      card.innerHTML = `<div class="metric-label">${c.label}</div>
        <div class="metric-value ${cls}" style="font-size:16px;">${valStr}${c.pct != null ? ` (${c.pct}%)` : ""}</div>`;
      el.appendChild(card);
    });
    if(portfolio.as_of){
      const note = document.createElement("div");
      note.style.gridColumn = "1 / -1";
      note.className = "faint";
      note.style.fontSize = "11px";
      note.textContent = `From manually imported statement, as of ${portfolio.as_of}. Day P&L isn't available from a static export.`;
      el.appendChild(note);
    }
  }

  function renderNews(news){
    const el = document.getElementById("news-list");
    el.innerHTML = "";
    const sources = Object.entries(news || {});
    if(!sources.length || sources.every(([,arts]) => !arts || !arts.length)){
      el.innerHTML = `<div class="empty" style="grid-column:1/-1;">No headlines yet &mdash; check the feed is running.</div>`;
      return;
    }
    sources.forEach(([source, articles]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3>${source}</h3>`;
      (articles || []).forEach(a => {
        if(a.error) return;
        const item = document.createElement("div");
        item.className = "news-item";
        item.innerHTML = `<a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
          <div class="news-source">${a.published || ""}</div>`;
        card.appendChild(item);
      });
      el.appendChild(card);
    });
  }

  function renderMutualFunds(mf){
    const perfEl = document.getElementById("fund-performance");
    const allocEl = document.getElementById("fund-allocation");
    perfEl.innerHTML = "";
    allocEl.innerHTML = "";
    if(!mf || mf.status === "not_connected"){
      perfEl.innerHTML = `<div class="empty" style="grid-column:1/-1;">Not connected yet.
        <div class="action">Import a mutual fund statement to see this</div></div>`;
      return;
    }
    const cards = [
      {label: "Current Value", val: mf.current_value},
      {label: "Invested Value", val: mf.total_invested},
      {label: "Gain/Loss", val: mf.gain_loss, pct: mf.gain_loss_pct},
      {label: "XIRR", val: mf.xirr_pct + "%"},
    ];
    cards.forEach(c => {
      const card = document.createElement("div");
      card.className = "card";
      let valStr = c.val;
      if(typeof c.val === "number") valStr = c.val.toLocaleString(undefined, {maximumFractionDigits:2});
      const cls = (typeof c.val === "number" && c.val < 0) ? "neg" : (typeof c.val === "number" ? "pos" : "");
      card.innerHTML = `<div class="metric-label">${c.label}</div>
        <div class="metric-value ${cls}" style="font-size:16px;">${valStr}${c.pct != null ? ` (${c.pct}%)` : ""}</div>`;
      perfEl.appendChild(card);
    });
    if(mf.as_of){
      const note = document.createElement("div");
      note.style.gridColumn = "1 / -1";
      note.className = "faint";
      note.style.fontSize = "11px";
      note.textContent = `From manually imported statement, as of ${mf.as_of}.`;
      perfEl.appendChild(note);
    }

    Object.entries(mf.allocation_pct || {}).forEach(([cat, pct]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="metric-label">${cat}</div><div class="metric-value" style="font-size:16px;">${pct}%</div>`;
      allocEl.appendChild(card);
    });
  }

  function riskLabel(risk){
    if(risk == null) return "--";
    if(risk >= 70) return "High";
    if(risk >= 40) return "Medium";
    return "Low";
  }

  function opportunityCard(item){
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <h3 style="margin:0;">${item.symbol}</h3>
        <span class="mono" style="font-size:12px;color:var(--teal);">score ${item.score}</span>
      </div>
      <div class="dim" style="font-size:12px;margin:2px 0 8px;">${item.name || ""} &middot; ${item.sector || ""}</div>
      <div style="font-size:13px;margin-bottom:8px;">${item.why}</div>
      <div style="font-size:11px;color:var(--text-faint);">Confidence ${item.confidence} &middot; Risk ${riskLabel(item.risk)}</div>
    </div>`;
  }

  function renderOpportunityRadar(opp){
    const el = document.getElementById("opportunity-radar");
    el.innerHTML = "";
    if(!opp || !opp.consolidated_top || !opp.consolidated_top.length){
      el.innerHTML = `<div class="empty" style="grid-column:1/-1;">No opportunity data yet &mdash; the daily scan hasn't run, or hasn't found matches under current rules.</div>`;
      return;
    }
    opp.consolidated_top.slice(0,5).forEach(item => {
      el.insertAdjacentHTML("beforeend", opportunityCard(item));
    });
  }

  function renderTopPicks(opp, sectorFilter){
    const el = document.getElementById("top-picks");
    const select = document.getElementById("sector-filter");
    el.innerHTML = "";
    if(!opp || !opp.consolidated_top || !opp.consolidated_top.length){
      el.innerHTML = `<div class="empty" style="grid-column:1/-1;">No picks yet &mdash; the daily scan hasn't run, or hasn't found matches under current rules.</div>`;
      return;
    }
    const sectors = [...new Set(opp.consolidated_top.map(i => i.sector).filter(Boolean))];
    if(select.options.length <= 1){
      sectors.forEach(s => {
        const o = document.createElement("option");
        o.value = s; o.textContent = s;
        select.appendChild(o);
      });
    }
    let items = opp.consolidated_top.slice(0,10);
    if(sectorFilter && sectorFilter !== "all"){
      items = items.filter(i => i.sector === sectorFilter);
    }
    if(!items.length){
      el.innerHTML = `<div class="empty" style="grid-column:1/-1;">No picks in this sector today.</div>`;
      return;
    }
    items.forEach(item => el.insertAdjacentHTML("beforeend", opportunityCard(item)));
  }

  document.getElementById("sector-filter").addEventListener("change", (e) => {
    renderTopPicks(lastOpportunities, e.target.value);
  });

  async function refresh(){
    try{
      const res = await fetch(dataUrl, {cache:"no-store"});
      if(!res.ok) throw new Error("fetch failed: " + res.status);
      const json = await res.json();
      renderTicker(json.market_prices, json.fetched_at);
      renderOverviewPrices(json.market_prices, json.fetched_at);
      renderNews(json.news);
    }catch(err){
      console.warn("Could not load data feed:", err.message);
      renderTicker({}, null);
    }

    try{
      const pfRes = await fetch(portfolioUrl, {cache:"no-store"});
      if(!pfRes.ok) throw new Error("fetch failed: " + pfRes.status);
      const pf = await pfRes.json();
      renderPortfolio(pf);
    }catch(err){
      console.warn("Could not load portfolio feed:", err.message);
      renderPortfolio(null);
    }

    try{
      const mfRes = await fetch(mfUrl, {cache:"no-store"});
      if(!mfRes.ok) throw new Error("fetch failed: " + mfRes.status);
      const mf = await mfRes.json();
      renderMutualFunds(mf);
    }catch(err){
      console.warn("Could not load mutual funds feed:", err.message);
      renderMutualFunds(null);
    }

    try{
      const oppRes = await fetch(oppUrl, {cache:"no-store"});
      if(!oppRes.ok) throw new Error("fetch failed: " + oppRes.status);
      lastOpportunities = await oppRes.json();
      renderOpportunityRadar(lastOpportunities);
      renderTopPicks(lastOpportunities, document.getElementById("sector-filter").value);
    }catch(err){
      console.warn("Could not load opportunities feed:", err.message);
      renderOpportunityRadar(null);
      renderTopPicks(null, "all");
    }
  }

  refresh();
  setInterval(refresh, CONFIG.REFRESH_MS);
</script>

</body>
</html>
